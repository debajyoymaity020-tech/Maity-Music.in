      .input:hover{

<body>

     <div class="oo"><span class="c">Only Bhojpuri</span> <span class="no">No...</span>comment <span class="no">No...</span>argument</div>
    <div class="bp">Only for Bhojpuri lovers </div>
        <div class="input">
        <input type="password" placeholder="Enter Password to access......!!" id="ps">
        </div>
        <button id="btn">Login</button>
    </form>
    
    <script>
        const ms=document.getElementById('message');
        const btn=document.getElementById('btn');
        btn.addEventListener('click',function(event){
            event.preventDefault();
            const ps=document.getElementById("ps").value;
            if(ps==2007){
                ms.innerText="Login Successful";
                ms.style.color="#1ed760";
                ms.style.display="block";
                setTimeout(function(){
                    window.location.href="bhojpuri_vives.html"
                     ms.innerText="Login Successful";
                },1200)
            }
            else{
                  ms.innerText="Login Failed !!";
                ms.style.color="Red";
                ms.style.display="block";
                setTimeout(function(){
                    ms.innerText="";
                    ms.style.display="none";
                },700)
            }
        })

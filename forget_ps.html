<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/forget_ps.css">
     <link rel="apple-touch-icon" href="images/M-icon-512.png">
<link rel="icon" type="image/png" href="images/M-icon-512.png">
    <title>Password reset page</title>
</head>
<style>
   html{
    border: none !important;
    border-radius: none !important;
    background-color: none !important;
}
body{
    min-height: 100vh;
    background:
        radial-gradient(circle at 15% 20%, #043d26 0%, transparent 30%),
        radial-gradient(circle at 90% 10%, #075a31 0%, transparent 35%),
        linear-gradient(135deg, #021711, #00100c 60%, #031c14);
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    position: relative;
}
.box{
    /* height: 80vh; */
    width: 40%;
    border: 1px solid #1ed760;
    margin-top: 5%;
    margin-left: 32%;
    border-radius: 8%;
    box-shadow: 0 0 7px #1ed760,
    0 0 10px #1ed760;
}
.m-box{
     display: flex;
    gap: 10px;
    margin-left: 24%;
    
}
.m{
    font-size: 40px;
    text-shadow: 0 0 10px #1ed760,
    0 0 25px #1ed760;
    margin-top: 10%;
}
.s{
    font-size:90px;
    margin-top: 1%;
    color: #1ed760;
}
.in-b{
    display: flex;
}
.in-u{
    margin-top: 5%;
    display: flex;
}
.input{
    height: 70px;
    width: 60%;
    border: 1px solid #075a31;
    border-radius: 10px;
    /* text-align: center; */
    margin-left: 8%;
    
}
.input  input{
    border: none;
    background: transparent;
    font-size: 20px;
    outline: none;
    width: 90%;
    margin-top: 7%;
    color: white;
    margin-left: 5%;
}
.input1{
    height: 70px;
    width: 83%;
    border: 1px solid #075a31;
    border-radius: 10px;
    /* text-align: center; */
    margin-left: 8%;
    
}
.input1  input{
    border: none;
    background: transparent;
    font-size: 20px;
    outline: none;
    width: 90%;
    margin-top: 4.4%;
    color: white;
    margin-left: 5%;
}

button{
    font-size: 20px;
    margin-left: 3%;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid #075a31;
    background-color: #1ed760;
    height: 100%;
    padding: 20px 16px;
}
button:active{
    zoom: 90%;
}
button:hover{
    box-shadow: 0 0 10px #1ed760,
    0 0 20px #1ed760;
    transition: all ease-in-out 0.2s;
    transform: scale(1.02);
}

.input:hover,
.input1:hover{
    border: 1px solid #1ed760;
    transition: all ease-in-out 0.3s;
}
input::placeholder{
    width: 100vh;
}
.lb{
    height: 80px;
    /* width: 100%; */
    display: flex;
    align-items: center;
    margin-top: 5%;
    margin-left: 32%;
}
p{
    margin-bottom: 20%;
}
@media(max-height:700px){
    .box{
        margin-top: 2.5%;
    }
    p{
        margin-bottom: 4%;
    }
}
#message{
    position: absolute;
    top: -8%;
    left: 41%;
    background-color: #1ed760;
    padding: 2px 8px;
    border-radius: 18px;
    display: none;
    text-shadow: 0 0 10px black,
    0 0 20px black;
}

</style>
<body>
   
      <h2 id="message"></h2>
 
    <div class="box">
       <div class="m-box">
         <div class="m">Maity</div>
        <div class="s">♫</div>
        <div class="m">Music</div>
       </div>
       <form action="">
       <div class="in-b">
         <div class="input">
            <input type="email" name="" id="" placeholder="Enter email or phone">
         </div>
         <button id="opt-btn">Send OTP</button>
    </div>
 <div class="in-u">
         <div class="input">
            <input type="number" name="" id="" placeholder="Enter OTP Please">
         </div>
         <button id="av">Verify OTP</button>
    </div>
    <div class="in-u">
         <div class="input1">
            <input type="password" name="" id="" placeholder="Enter New Password">
         </div>
         <!-- <button>Verify OTP</button> -->
    </div>
    <div class="in-u">
         <div class="input1">
            <input type="password" name="" id="" placeholder="Confarm password">
         </div>
         <!-- <button>Verify OTP</button> -->
    </div>
<div class="lb">
    <button id="rp"><b>Reset Password</b></button>
   
    <!-- <div class="space">||</div>
    <button><b>Login</b></button> -->
</div>
 <p></p>
    
       </form>
    </div>
    <script>
      const password=document.getElementById('rp');
      const message=document.getElementById('message');
      password.addEventListener('click',function(event){
         event.preventDefault();
         message.innerText="Password reset successful ✅";
         message.style.display="block"
         setTimeout(function(){
            message.style.display="none";
            window.location.href="index.html"
         },1400);

      })
       const otp=document.getElementById('opt-btn');
      otp.addEventListener('click',function(event){
         event.preventDefault();
         message.innerText="OTP sent successfuly ✅";
         message.style.display="block"
         setTimeout(function(){
            message.style.display="none";
         },300);

      })
       const av=document.getElementById('av');
      av.addEventListener('click',function(event){
         event.preventDefault();
         message.innerText="Acount verify successfully ✅";
         message.style.display="block"
         setTimeout(function(){
            message.style.display="none";
         },350);

      })
      
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/forget_ps.css">
     <link rel="apple-touch-icon" href="images/M-icon-512.png">
<link rel="icon" type="image/png" href="images/M-icon-512.png">
    <title>Password reset page</title>
</head>
<body>
   
      <h2 id="message"></h2>
 
    <div class="box">
       <div class="m-box">
         <div class="m">Maity</div>
        <div class="s">♫</div>
        <div class="m">Music</div>
       </div>
       <form action="">
       <div class="in-b">
         <div class="input">
            <input type="email" name="" id="" placeholder="Enter email or phone">
         </div>
         <button id="opt-btn">Send OTP</button>
    </div>
 <div class="in-u">
         <div class="input">
            <input type="number" name="" id="" placeholder="Enter OTP Please">
         </div>
         <button id="av">Verify OTP</button>
    </div>
    <div class="in-u">
         <div class="input1">
            <input type="password" name="" id="" placeholder="Enter New Password">
         </div>
         <!-- <button>Verify OTP</button> -->
    </div>
    <div class="in-u">
         <div class="input1">
            <input type="password" name="" id="" placeholder="Confarm password">
         </div>
         <!-- <button>Verify OTP</button> -->
    </div>
<div class="lb">
    <button id="rp"><b>Reset Password</b></button>
   
    <!-- <div class="space">||</div>
    <button><b>Login</b></button> -->
</div>
 <p></p>
    
       </form>
    </div>
    <script>
      const password=document.getElementById('rp');
      const message=document.getElementById('message');
      password.addEventListener('click',function(event){
         event.preventDefault();
         message.innerText="Password reset successful ✅";
         message.style.display="block"
         setTimeout(function(){
            message.style.display="none";
            window.location.href="index.html"
         },1400);

      })
       const otp=document.getElementById('opt-btn');
      otp.addEventListener('click',function(event){
         event.preventDefault();
         message.innerText="OTP sent successfuly ✅";
         message.style.display="block"
         setTimeout(function(){
            message.style.display="none";
         },300);

      })
       const av=document.getElementById('av');
      av.addEventListener('click',function(event){
         event.preventDefault();
         message.innerText="Acount verify successfully ✅";
         message.style.display="block"
         setTimeout(function(){
            message.style.display="none";
         },350);

      })
      
    </script>
</body>
</html>
